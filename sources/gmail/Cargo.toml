[package]
name = "gmail"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63.0"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
sha2 = "0.10"
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std"] }
html2text = "0.17"
mailparse = "0.16"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Independent workspace: this module builds inside a provider monorepo or alone.
[workspace]
